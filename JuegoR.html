<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8"> <!--Codificación de caracteres-->
    <title>Ejemplo: Juego de Reglas en CSS</title>
    <style>
        /* REGLA 1: Controla el primer título */
        h1 {
            padding-top: 1em; /*Relleno superior relativo*/
            border-bottom: 1px solid #ccc; /*Borde inferior gris continuo*/
            font-size: 32px; /*Tamaño de la fuente del título h1*/
        }

        /* REGLA 2: Controla el segundo título */
        h2 {
            padding-top: 1em; /*Relleno superior relativo*/
            border-bottom: 1px solid #ccc; /*Borde inferior gris continuo*/
            font-size: 16px; /*Tamaño de la fuente del título h2*/
        }
    </style>
</head>
<body>

    <h1>Título Grande (Letra de 32px = Relleno de 32px)</h1> <!--Primer título principal-->
    
    <h2>Título Pequeño (Letra de 16px = Relleno de 16px)</h2> <!--Segundo título secundario-->

</body>
</html>
