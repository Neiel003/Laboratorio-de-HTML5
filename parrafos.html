<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="estilosParrafos.css">
        <title>Ejemplo de Parrafos</title>
    </head>
    <body>
        <div class="barra-superior">
            <div class="bloque-izquierda">
                <a href="./" class="btn-flecha-regresar" title="Regresar a la carpeta anterior">←</a>
                
                <div class="nombre-marca">
                    VASTI LEGASPI
                    <span>DESARROLLO WEB</span>
                </div>
            </div>

            <div class="menu-navegacion">
                <span class="michi-sticker">🐾 🐱</span>
            </div>
        </div>
        <p> <!-- Etiqueta para iniciar un párrafo de texto -->
            Jon Said,
            <q> <!-- Etiqueta para una cita textual corta entre comillas -->
                That'll be Good when it's <strong>finished </strong>
            </q>
            If only he <strong>knew</strong>!
        </p>
    </body>
</html>
